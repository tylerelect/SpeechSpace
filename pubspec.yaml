name: speechspace
description: An interactive speech service to help parents have an at-a-glance view of their child's development, personally and productively.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.3
  record: ^7.2.0
  shared_preferences: ^2.5.6
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sound/
    - assets/sound/videos/
  # Nunito (SIL OFL, see assets/fonts/OFL.txt): a round, friendly, easy-to-read font for Kids mode.
  # One variable file covers every weight.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
